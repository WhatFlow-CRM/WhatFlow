<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Sender - Feature Guides</title>
    <link href='https://fonts.googleapis.com/css?family=PT Sans Caption' rel='stylesheet'>
    <link rel="stylesheet" href="css/blog.css">
    <link rel="icon" type="image/png" href="logo/prosenderLogo.png">
</head>

<body>
    <!-- Header -->
    <header class="blog-header">
        <div class="header-inner">
            <div class="brand">
                <img src="logo/prosenderLogo.png" alt="Pro Sender" class="brand-icon">
                <span class="brand-name">Pro Sender</span>
                <span class="brand-tag">Feature Guides</span>
            </div>
            <div class="header-search">
                <input type="text" id="blog-search" placeholder="Search guides...">
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>Learn How to Use Pro Sender</h1>
        <p>Step-by-step guides to help you get the most out of every feature.</p>
    </section>

    <!-- Filter Tabs -->
    <section class="filter-section">
        <div class="filter-tabs" id="filter-tabs"></div>
    </section>

    <!-- Blog Cards (rendered by JS) -->
    <main class="blog-grid" id="blog-grid"></main>

    <!-- Empty State -->
    <div class="empty-state hide" id="empty-state">
        <img src="logo/question.png" alt="No results">
        <p>No guides found matching your search.</p>
        <button class="clear-search-btn" id="clear-search">Clear Search</button>
    </div>

    <!-- Footer -->
    <footer class="blog-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <img src="logo/prosenderLogo.png" alt="Pro Sender">
                <span>Pro Sender</span>
            </div>
            <p class="footer-text">Need more help? Use the <strong>Chat Support</strong> button in the extension popup.
            </p>
        </div>
    </footer>

    <script src="js/blog.js"></script>
</body>

</html>
